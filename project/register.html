<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Community Event Management</title>

    <style>

        /* ================= GENERAL ================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #4f46e5,
                #7c3aed
            );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 20px;
        }

        a {
            text-decoration: none;
        }


        /* ================= REGISTER CONTAINER ================= */

        .register-container {

            width: 100%;
            max-width: 500px;

            background-color: white;

            padding: 40px;

            border-radius: 12px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.2);
        }


        /* ================= HEADER ================= */

        .logo {

            text-align: center;

            font-size: 28px;

            font-weight: bold;

            color: #4f46e5;

            margin-bottom: 8px;
        }

        .subtitle {

            text-align: center;

            color: #666;

            margin-bottom: 30px;

            font-size: 15px;
        }


        /* ================= FORM ================= */

        .form-group {

            margin-bottom: 18px;
        }

        .form-group label {

            display: block;

            margin-bottom: 7px;

            font-weight: 600;

            color: #333;
        }

        .form-group input,
        .form-group select {

            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 6px;

            font-size: 15px;

            outline: none;

            background-color: white;

            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {

            border-color: #4f46e5;

            box-shadow:
                0 0 0 2px rgba(79, 70, 229, 0.1);
        }


        /* ================= PASSWORD ================= */

        .password-container {

            position: relative;
        }

        .password-container input {

            padding-right: 65px;
        }

        .show-password {

            position: absolute;

            right: 12px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: none;

            color: #4f46e5;

            cursor: pointer;

            font-size: 13px;

            font-weight: bold;
        }


        /* ================= PASSWORD STRENGTH ================= */

        .password-strength {

            margin-top: 6px;

            font-size: 12px;

            color: #777;
        }


        /* ================= TERMS ================= */

        .terms {

            display: flex;

            align-items: flex-start;

            gap: 8px;

            margin: 20px 0;

            font-size: 13px;

            color: #555;

            line-height: 1.5;
        }

        .terms input {

            margin-top: 3px;

            cursor: pointer;
        }

        .terms a {

            color: #4f46e5;

            font-weight: bold;
        }


        /* ================= REGISTER BUTTON ================= */

        .register-button {

            width: 100%;

            padding: 14px;

            background-color: #4f46e5;

            color: white;

            border: none;

            border-radius: 6px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .register-button:hover {

            background-color: #4338ca;
        }


        /* ================= MESSAGE ================= */

        #message {

            text-align: center;

            margin-top: 15px;

            font-size: 14px;

            line-height: 1.5;
        }


        /* ================= LOGIN ================= */

        .login-text {

            text-align: center;

            margin-top: 25px;

            color: #666;

            font-size: 14px;
        }

        .login-text a {

            color: #4f46e5;

            font-weight: bold;
        }

        .login-text a:hover {

            text-decoration: underline;
        }


        /* ================= HOME LINK ================= */

        .home-link {

            display: block;

            text-align: center;

            margin-top: 18px;

            color: #555;

            font-size: 14px;
        }

        .home-link:hover {

            color: #4f46e5;
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 550px) {

            .register-container {

                padding: 30px 25px;
            }

            .logo {

                font-size: 24px;
            }

        }

    </style>

</head>


<body>


    <!-- ================= REGISTER BOX ================= -->

    <div class="register-container">


        <!-- HEADER -->

        <div class="logo">
            Community Events
        </div>

        <p class="subtitle">
            Create your account
        </p>


        <!-- ================= REGISTRATION FORM ================= -->

        <form id="registerForm">


            <!-- FULL NAME -->

            <div class="form-group">

                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    maxlength="10"
                    required
                >

            </div>


            <!-- ROLE -->

            <div class="form-group">

                <label for="role">
                    Select Role
                </label>

                <select id="role" required>

                    <option value="">
                        -- Select your role --
                    </option>

                    <option value="participant">
                        Participant
                    </option>

                    <option value="volunteer">
                        Volunteer
                    </option>

                    <option value="organizer">
                        Event Organizer
                    </option>

                </select>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-container">

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('password', this)"
                    >
                        Show
                    </button>

                </div>

                <div
                    id="passwordStrength"
                    class="password-strength"
                >
                    Password must contain at least 6 characters.
                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="password-container">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('confirmPassword', this)"
                    >
                        Show
                    </button>

                </div>

            </div>


            <!-- TERMS -->

            <label class="terms">

                <input
                    type="checkbox"
                    id="terms"
                    required
                >

                <span>
                    I agree to the
                    <a href="#">
                        Terms & Conditions
                    </a>
                    and
                    <a href="#">
                        Privacy Policy
                    </a>.
                </span>

            </label>


            <!-- REGISTER BUTTON -->

            <button
                type="submit"
                class="register-button"
            >
                Create Account
            </button>


            <!-- MESSAGE -->

            <p id="message"></p>


        </form>


        <!-- LOGIN -->

        <p class="login-text">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


        <!-- HOME -->

        <a
            href="index.html"
            class="home-link"
        >
            ← Back to Home
        </a>


    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>


        /* ================= SHOW / HIDE PASSWORD ================= */

        function togglePassword(fieldId, button) {

            const password =
                document.getElementById(fieldId);


            if (password.type === "password") {

                password.type = "text";

                button.textContent = "Hide";

            } else {

                password.type = "password";

                button.textContent = "Show";

            }

        }


        /* ================= PASSWORD STRENGTH ================= */

        document
            .getElementById("password")
            .addEventListener("input", function() {

                const password = this.value;

                const strength =
                    document.getElementById("passwordStrength");


                if (password.length === 0) {

                    strength.textContent =
                        "Password must contain at least 6 characters.";

                    strength.style.color = "#777";

                }

                else if (password.length < 6) {

                    strength.textContent =
                        "Password is too short.";

                    strength.style.color = "red";

                }

                else if (password.length < 10) {

                    strength.textContent =
                        "Password strength: Medium";

                    strength.style.color = "orange";

                }

                else {

                    strength.textContent =
                        "Password strength: Strong";

                    strength.style.color = "green";

                }

            });


        /* ================= REGISTRATION ================= */

        document
            .getElementById("registerForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                const name =
                    document.getElementById("fullName").value.trim();

                const email =
                    document.getElementById("email").value.trim();

                const phone =
                    document.getElementById("phone").value.trim();

                const role =
                    document.getElementById("role").value;

                const password =
                    document.getElementById("password").value;

                const confirmPassword =
                    document.getElementById("confirmPassword").value;

                const terms =
                    document.getElementById("terms").checked;

                const message =
                    document.getElementById("message");


                /* CHECK NAME */

                if (name.length < 3) {

                    message.textContent =
                        "Please enter a valid name.";

                    message.style.color = "red";

                    return;
                }


                /* CHECK PHONE */

                if (!/^[0-9]{10}$/.test(phone)) {

                    message.textContent =
                        "Please enter a valid 10-digit phone number.";

                    message.style.color = "red";

                    return;
                }


                /* CHECK ROLE */

                if (role === "") {

                    message.textContent =
                        "Please select a role.";

                    message.style.color = "red";

                    return;
                }


                /* CHECK PASSWORD */

                if (password.length < 6) {

                    message.textContent =
                        "Password must contain at least 6 characters.";

                    message.style.color = "red";

                    return;
                }


                /* CHECK PASSWORD MATCH */

                if (password !== confirmPassword) {

                    message.textContent =
                        "Passwords do not match.";

                    message.style.color = "red";

                    return;
                }


                /* CHECK TERMS */

                if (!terms) {

                    message.textContent =
                        "Please accept the Terms & Conditions.";

                    message.style.color = "red";

                    return;
                }


                /* SUCCESS */

                message.textContent =
                    "Registration successful! You can now login.";

                message.style.color = "green";


                /*
                    This is currently frontend-only.

                    Later, we can connect this form
                    to a backend and database.
                */

            });

    </script>


</body>

</html>
